<!DOCTYPE html>
<html>
<head>
    <title>Book of Miracles</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 20px; background: #f0f7f0; }
        button { padding: 15px 25px; margin: 10px; font-size: 18px; background: #2e7d32; color: white; border: none; border-radius: 10px; }
        button:hover { background: #1b5e20; }
    </style>
</head>
<body>
    <h1>📖 Book of Miracles</h1>
    <p>Daily Gratitude Journal</p>

    <button onclick="newEntry()">✍️ New Entry</button>
    <button onclick="viewEntries()">📖 My Entries</button>
    <button onclick="exportBook()">📤 Export Book</button>

    <div id="form" style="display:none; margin-top:30px;">
        <input type="date" id="date"><br><br>
        <textarea id="miracle" placeholder="Miracle today..." rows="3" style="width:80%;"></textarea><br><br>
        <textarea id="gratitude" placeholder="Grateful for..." rows="3" style="width:80%;"></textarea><br><br>
        <button onclick="save()">Save Entry</button>
    </div>

    <div id="list"></div>

    <script>
        let entries = JSON.parse(localStorage.getItem("miracles")) || [];

        function newEntry() {
            document.getElementById("form").style.display = "block";
            document.getElementById("list").innerHTML = "";
        }

        function save() {
            const date = document.getElementById("date").value || new Date().toISOString().split("T")[0];
            const miracle = document.getElementById("miracle").value;
            const gratitude = document.getElementById("gratitude").value;
            if (miracle || gratitude) {
                entries.push({date, miracle, gratitude});
                localStorage.setItem("miracles", JSON.stringify(entries));
                alert("Saved!");
                document.getElementById("form").style.display = "none";
                viewEntries();
            }
        }

        function viewEntries() {
            document.getElementById("form").style.display = "none";
            const list = document.getElementById("list");
            list.innerHTML = "<h2>My Entries</h2>";
            if (entries.length === 0) {
                list.innerHTML += "<p>No entries yet.</p>";
                return;
            }
            entries.forEach((e, i) => {
                const div = document.createElement("div");
                div.innerHTML = `<p><strong>${e.date}</strong><br>Miracle: ${e.miracle}<br>Grateful: ${e.gratitude}</p><button onclick="del(${i})">Delete</button><hr>`;
                list.appendChild(div);
            });
        }

        function del(i) {
            if (confirm("Delete?")) {
                entries.splice(i, 1);
                localStorage.setItem("miracles", JSON.stringify(entries));
                viewEntries();
            }
        }

        function exportBook() {
            if (entries.length === 0) return alert("No entries");
            let text = "Book of Miracles\n\n";
            entries.forEach(e => text += `${e.date}\nMiracle: ${e.miracle}\nGrateful: ${e.gratitude}\n\n`);
            const blob = new Blob([text], {type: "text/plain"});
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "My-Book-of-Miracles.txt";
            a.click();
        }

        // Start with new entry form
        window.onload = newEntry;
    </script>
</body>
</html>
