<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book of Miracles</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500&display=swap');
        body { font-family: 'Inter', Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: linear-gradient(180deg, #f0f7f0, #e8f5e8); color: #333; line-height: 1.7; }
        h1 { font-family: 'Playfair Display', serif; color: #1e5c2b; text-align: center; font-size: 2.6em; }
        .subtitle { text-align: center; font-size: 1.3em; color: #2e7d32; margin-bottom: 20px; }
        .nav { text-align: center; margin: 25px 0; }
        button { background: #2e7d32; color: white; padding: 14px 24px; border: none; border-radius: 50px; cursor: pointer; font-size: 1.05em; margin: 6px; }
        button:hover { background: #1b5e20; }
        .section { background: white; padding: 25px; border-radius: 20px; margin-bottom: 25px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
        audio { width: 100%; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>📖 Book of Miracles</h1>
    <p class="subtitle">Daily Gratitude & Small Miracles • One day at a time</p>

    <div class="nav">
        <button onclick="showForm()">✍️ New Entry</button>
        <button onclick="showEntries()">📖 My Entries</button>
        <button onclick="exportBook()">📤 Export Book</button>
    </div>

    <!-- Thought of the Day -->
    <div class="section">
        <h2>💡 Thought of the Day</h2>
        <p id="thought" style="font-style:italic; color:#1e5c2b;"></p>
    </div>

    <!-- Audio Resources -->
    <div class="section">
        <h2>🎧 Helpful Audio</h2>
        <p><strong>The Four Agreements</strong></p>
        <audio controls>
            <source src="https://www.youtube.com/embed/0z4x1J5o0zA" type="audio/mpeg">
        </audio>
        <p><em>Don Miguel Ruiz - The Four Agreements (Summary / Key Ideas)</em></p>
        
        <p><strong>Letting Go & Presence</strong> (Ryan's Lessons style)</p>
        <audio controls>
            <source src="https://www.youtube.com/embed/5q4t7p4f7zU" type="audio/mpeg">
        </audio>
    </div>

    <form id="entryForm" style="display:none;" class="section">
        <label>Date</label>
        <input type="date" id="date" required>
        <label>What small miracle did I notice today?</label>
        <textarea id="miracle" rows="3" placeholder="How did God show up?"></textarea>
        <label>What am I grateful for?</label>
        <textarea id="gratitude" rows="3" placeholder="List 3+ things..."></textarea>
        <label>Reflection / Lesson</label>
        <textarea id="reflection" rows="3" placeholder="Letting go, presence, faith..."></textarea>
        <button type="button" onclick="saveEntry()" style="width:100%;">Save Entry</button>
    </form>

    <div id="entries" class="section"></div>

    <script>
        // Thought of the Day
        const thoughts = [
            "When you try to float, you sink. When you let go, you float. - Ryan",
            "The real miracle might be loving myself enough to finally be present.",
            "Small miracles happen daily if we have eyes to see them.",
            "You are not your thoughts. Sit with them gently.",
            "God answers needs, not always wants. Keep walking in faith."
        ];
        document.getElementById('thought').textContent = thoughts[Math.floor(Math.random() * thoughts.length)];

        let entries = JSON.parse(localStorage.getItem('miraclesEntries')) || [];

        function showForm() {
            document.getElementById('entryForm').style.display = 'block';
            document.getElementById('entries').style.display = 'none';
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
        }

            document.getElementById('entryForm').style.display = 'none';
            const container = document.getElementById('entries');

            container.innerHTML = '<h2>My Entries</h2>';

                container.innerHTML += '<p>No entries yet. Start today!</p>';
                return;
