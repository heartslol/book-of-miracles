<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lens of Love</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1: #2b2127;
      --bg2: #3a2e35;
      --accent: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.75);
      --tile-overlay: rgba(0,0,0,0.34);
    }

    html,body{
      height:100%;
      margin:0;
      font-family: 'Montserrat', Arial, sans-serif;
      color:var(--accent);
      background: radial-gradient(1200px 600px at 10% 10%, rgba(255,255,255,0.02), transparent),
                  linear-gradient(180deg, #2b2026 0%, #33252b 50%, #2a1f24 100%);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .container{
      max-width:1100px;
      margin:0 auto;
      padding:32px 20px 80px;
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-bottom:28px;
    }

    .brand {
      text-align:center;
      flex:1;
    }

    .brand h1{
      margin:0;
      font-family: 'Great Vibes', cursive;
      font-size:64px;
      letter-spacing:2px;
      color:var(--accent);
      line-height:0.9;
      text-shadow: 0 6px 24px rgba(0,0,0,0.6);
    }

    nav {
      display:flex;
      gap:18px;
      align-items:center;
      justify-content:flex-end;
      min-width:220px;
      flex-wrap:wrap;
    }

    nav a {
      color:var(--muted);
      text-decoration:none;
      font-weight:600;
      font-size:16px;
      padding:8px 10px;
      border-radius:6px;
      transition: all .18s ease;
    }

    nav a:hover{
      color:var(--accent);
      background: rgba(255,255,255,0.03);
      transform:translateY(-2px);
    }

    .user-info {
      display:flex;
      gap:12px;
      align-items:center;
      color:var(--muted);
      font-size:14px;
    }

    .actions {
      display:flex;
      gap:12px;
      justify-content:center;
      margin-bottom:26px;
      flex-wrap:wrap;
    }

    .btn {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      color:var(--accent);
      border: 1px solid rgba(255,255,255,0.06);
      padding:12px 18px;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
      transition: transform .16s ease, box-shadow .16s ease;
    }

    .btn:hover{ transform: translateY(-3px); box-shadow:0 14px 30px rgba(0,0,0,0.6); }

    .btn.voice { background: #1f6ed6; color:white; border:none; }

    .btn.logout { background: rgba(200,77,77,0.8); color:white; border:none; }

    #main {
      margin-top:8px;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.14));
      border-radius:14px;
      padding:22px;
      box-shadow: 0 8px 26px rgba(0,0,0,0.45);
      color:var(--accent);
    }

    label {
      display:block;
      margin-bottom:8px;
      font-weight:600;
      color:var(--muted);
    }

    input[type="date"], input[type="email"], input[type="password"], textarea, input[type="text"]{
      width:100%;
      padding:12px;
      border-radius:8px;
      border: none;
      background: rgba(255,255,255,0.02);
      color:var(--accent);
      font-size:16px;
      outline: none;
      resize:vertical;
      box-sizing:border-box;
      margin-bottom:12px;
    }

    textarea { min-height:100px; }

    .auth-form {
      max-width:400px;
      margin:40px auto;
    }

    .auth-form .card {
      padding:32px;
    }

    .auth-form h2 {
      text-align:center;
      margin-bottom:24px;
    }

    .auth-form .error {
      color:#ff6b6b;
      margin-bottom:12px;
      font-size:14px;
    }

    .auth-form .success {
      color:#51cf66;
      margin-bottom:12px;
      font-size:14px;
    }

    .auth-tabs {
      display:flex;
      gap:12px;
      margin-bottom:20px;
      justify-content:center;
    }

    .auth-tabs button {
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
      color:var(--muted);
      padding:8px 16px;
      border-radius:6px;
      cursor:pointer;
      transition: all .2s ease;
    }

    .auth-tabs button.active {
      background:rgba(255,255,255,0.15);
      color:var(--accent);
      border-color:rgba(255,255,255,0.2);
    }

    .form-group {
      display:none;
    }

    .form-group.active {
      display:block;
    }

    .gallery {
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap:20px;
      margin-top:18px;
      align-items:start;
    }

    .tile {
      position:relative;
      height:140px;
      border-radius:10px;
      overflow:hidden;
      background-size:cover;
      background-position:center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: transform .22s ease, box-shadow .22s ease;
      cursor:pointer;
      border: 1px solid rgba(255,255,255,0.04);
    }

    .tile::after{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,0.00) 0%, rgba(0,0,0,0.22) 50%, rgba(0,0,0,0.55) 100%);
      pointer-events:none;
    }

    .tile .meta {
      position:absolute;
      left:12px;
      right:12px;
      bottom:12px;
      z-index:2;
      color:white;
    }

    .tile .title {
      font-weight:700;
      font-size:16px;
      text-shadow:0 6px 20px rgba(0,0,0,0.6);
    }

    .tile .subtitle {
      font-size:13px;
      opacity:0.95;
      margin-top:6px;
      color:rgba(255,255,255,0.9);
    }

    .tile .delete {
      position:absolute;
      top:8px;
      right:8px;
      z-index:3;
      background: rgba(0,0,0,0.4);
      border:none;
      color:white;
      padding:6px 8px;
      border-radius:6px;
      font-size:13px;
      display:none;
    }

    .tile:hover{ transform: translateY(-6px) scale(1.02); box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
    .tile:hover .delete{ display:block; }

    .empty {
      text-align:center;
      padding:40px;
      color:rgba(255,255,255,0.7);
    }

    footer {
      margin-top:42px;
      text-align:center;
      color:rgba(255,255,255,0.55);
      font-size:13px;
      opacity:0.9;
    }

    .badge-aha {
      display:inline-block;
      background: rgba(200,77,77,0.95);
      color:white;
      padding:4px 8px;
      border-radius:999px;
      font-size:12px;
      margin-left:8px;
      vertical-align:middle;
    }

    .challenge-content {
      color:var(--muted);
      line-height:1.8;
    }

    .challenge-content h3 {
      color:var(--accent);
      margin-top:20px;
      margin-bottom:12px;
      font-size:18px;
    }

    .challenge-content p {
      margin-bottom:12px;
    }

    .challenge-content strong {
      color:var(--accent);
    }

    .vow-section {
      background: rgba(255,255,255,0.03);
      border-left: 3px solid rgba(255,255,255,0.2);
      padding:20px;
      border-radius:8px;
      margin-top:20px;
      margin-bottom:12px;
    }

    .vow-section label {
      color:var(--accent);
      font-weight:700;
      margin-bottom:12px;
    }

    .vow-section input {
      margin-bottom:16px;
    }

    .vow-signature {
      font-style:italic;
      color:var(--muted);
      margin-top:12px;
    }

    @media (max-width:640px){
      header{
        flex-direction:column;
        align-items:center;
        gap:8px;
        margin-bottom:18px;
      }

      .brand h1{ font-size:44px; }

      nav{
        order:2;
        justify-content:center;
        min-width:auto;
        gap:10px;
        flex-wrap:wrap;
      }

      nav a{
        padding:8px 10px;
        font-size:15px;
      }

      .user-info {
        order:3;
        width:100%;
        justify-content:center;
        font-size:13px;
      }

      .actions{
        flex-direction:row;
        flex-wrap:wrap;
        gap:8px;
      }

      .actions .btn{
        flex:1 1 auto;
        min-width:120px;
      }

      .gallery { grid-template-columns: repeat(2, 1fr); gap:12px; }
      .tile{ height:120px; }

      .auth-form .card {
        padding:20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header id="header" style="display:none;">
      <div class="brand">
        <h1>Lens of Love</h1>
      </div>

      <nav aria-label="Main navigation">
        <a href="#" onclick="newEntry();return false;">Home</a>
        <a href="#" onclick="viewEntries();return false;">Gallery</a>
        <a href="#" onclick="viewAhaEntries();return false;">AHA Moments</a>
        <a href="#" onclick="iLoveMyself();return false;">I Love Myself</a>
        <a href="#" onclick="about();return false;">About</a>
        <a href="#" onclick="contact();return false;">Contact</a>
      </nav>

      <div class="user-info">
        <span id="userDisplay"></span>
        <button class="btn logout" onclick="logout()" style="margin:0;padding:6px 12px;font-size:14px;">Logout</button>
      </div>
    </header>

    <div class="actions" id="actions" style="display:none;">
      <button class="btn" onclick="newEntry()">New Entry</button>
      <button class="btn" onclick="viewEntries()">My Entries</button>
      <button class="btn" onclick="viewAhaEntries()">AHA Moments</button>
      <button class="btn" onclick="iLoveMyself()">I Love Myself</button>
      <button class="btn" onclick="exportBook()">Export</button>
    </div>

    <div id="main"></div>

    <footer>
      © <span id="year"></span> Lens of Love. All rights reserved.
    </footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    let currentUser = null;
    let entries = [];
    let users = JSON.parse(localStorage.getItem("users")) || {};

    function hashPassword(pwd) {
      let hash = 0;
      for (let i = 0; i < pwd.length; i++) {
        const char = pwd.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
      }
      return Math.abs(hash).toString(36);
    }

    function showAuth() {
      document.getElementById("header").style.display = "none";
      document.getElementById("actions").style.display = "none";
      document.getElementById("main").innerHTML = `
        <div class="auth-form">
          <div class="card">
            <h2>Lens of Love</h2>
            <div class="auth-tabs">
              <button class="active" onclick="switchAuthTab('login')">Login</button>
              <button onclick="switchAuthTab('signup')">Sign Up</button>
            </div>
            <div id="login" class="form-group active">
              <h3 style="margin-top:0;font-size:18px;">Welcome Back</h3>
              <div id="loginError" class="error" style="display:none;"></div>
              <label for="loginEmail">Email</label>
              <input id="loginEmail" type="email" placeholder="you@example.com">
              <label for="loginPassword">Password</label>
              <input id="loginPassword" type="password" placeholder="••••••••">
              <button class="btn" style="width:100%;margin-top:12px;" onclick="doLogin()">Login</button>
            </div>
            <div id="signup" class="form-group">
              <h3 style="margin-top:0;font-size:18px;">Create Account</h3>
              <div id="signupError" class="error" style="display:none;"></div>
              <div id="signupSuccess" class="success" style="display:none;"></div>
              <label for="signupEmail">Email</label>
              <input id="signupEmail" type="email" placeholder="you@example.com">
              <label for="signupPassword">Password</label>
              <input id="signupPassword" type="password" placeholder="••••••••" title="Minimum 6 characters">
              <label for="signupConfirm">Confirm Password</label>
              <input id="signupConfirm" type="password" placeholder="••••••••">
              <button class="btn" style="width:100%;margin-top:12px;" onclick="doSignup()">Create Account</button>
            </div>
            <div style="margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.1);font-size:13px;color:var(--muted);line-height:1.5;">
              <strong>⚠️ Demo Privacy Note:</strong> This app stores data locally in your browser.
            </div>
          </div>
        </div>
      `;
    }

    function switchAuthTab(tab) {
      document.querySelectorAll(".form-group").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".auth-tabs button").forEach(el => el.classList.remove("active"));
      document.getElementById(tab).classList.add("active");
      document.querySelector(`[onclick="switchAuthTab('${tab}')"]`).classList.add("active");
      document.getElementById("loginError").style.display = "none";
      document.getElementById("signupError").style.display = "none";
      document.getElementById("signupSuccess").style.display = "none";
    }

    function doLogin() {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const errorDiv = document.getElementById("loginError");
      if (!email || !password) {
        errorDiv.textContent = "Email and password required";
        errorDiv.style.display = "block";
        return;
      }
      if (!users[email] || users[email].password !== hashPassword(password)) {
        errorDiv.textContent = "Invalid email or password";
        errorDiv.style.display = "block";
        return;
      }
      currentUser = email;
      localStorage.setItem("currentUser", email);
      loadUserEntries();
      showApp();
    }

    function doSignup() {
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value;
      const confirm = document.getElementById("signupConfirm").value;
      const errorDiv = document.getElementById("signupError");
      const successDiv = document.getElementById("signupSuccess");
      errorDiv.style.display = "none";
      successDiv.style.display = "none";
      if (!email || !password) {
        errorDiv.textContent = "Email and password required";
        errorDiv.style.display = "block";
        return;
      }
      if (password.length < 6) {
        errorDiv.textContent = "Password must be at least 6 characters";
        errorDiv.style.display = "block";
        return;
      }
      if (password !== confirm) {
        errorDiv.textContent = "Passwords do not match";
        errorDiv.style.display = "block";
        return;
      }
      if (users[email]) {
        errorDiv.textContent = "This email is already registered";
        errorDiv.style.display = "block";
        return;
      }
      users[email] = { password: hashPassword(password), entries: [] };
      localStorage.setItem("users", JSON.stringify(users));
      successDiv.textContent = "Account created! Logging in...";
      successDiv.style.display = "block";
      setTimeout(() => {
        currentUser = email;
        localStorage.setItem("currentUser", email);
        loadUserEntries();
        showApp();
      }, 1000);
    }

    function loadUserEntries() {
      if (!currentUser || !users[currentUser]) {
        entries = [];
      } else {
        entries = users[currentUser].entries || [];
      }
    }

    function saveUserEntries() {
      if (currentUser && users[currentUser]) {
        users[currentUser].entries = entries;
        localStorage.setItem("users", JSON.stringify(users));
      }
    }

    function showApp() {
      document.getElementById("header").style.display = "flex";
      document.getElementById("actions").style.display = "flex";
      document.getElementById("userDisplay").textContent = "Logged in as: " + currentUser;
      if (entries.length) viewEntries();
      else newEntry();
    }

    function logout() {
      if (confirm("Logout?")) {
        currentUser = null;
        entries = [];
        localStorage.removeItem("currentUser");
        showAuth();
      }
    }

    function about(){
      document.getElementById("main").innerHTML = `<div class="card"><h2 style="margin-top:0;">About</h2><p style="color:var(--muted);line-height:1.6;">Lens of Love is a personal place to collect daily miracles, gratitude, and aha moments (perspective). Your entries are private and stored only in your account.</p></div>`;
    }

    function contact(){
      document.getElementById("main").innerHTML = `<div class="card"><h2 style="margin-top:0;">Contact</h2><p style="color:var(--muted);line-height:1.6;">Paul Jones<br>Phone: <a href="tel:+14352159314" style="color:var(--accent);text-decoration:underline;">435-215-9314</a><br>Email: <a href="mailto:heartslenseoflove@gmail.com" style="color:var(--accent);text-decoration:underline;">heartslenseoflove@gmail.com</a></p></div>`;
    }

    function iLoveMyself(){
      document.getElementById("main").innerHTML = `
        <div class="card">
          <h2 style="margin-top:0;">I Love Myself Challenge</h2>
          <div class="challenge-content">
            <p><strong>What if you don't love yourself or even like yourself?</strong> Just remain open to the possibility of loving yourself. The rest is easy.</p>
            <h3>Mental Loop</h3>
            <p>A thought loop is a pathway laid down by constant use. With enough time and intensity, if you repeat it again and again, you start to create a mental river that controls you. You believe it is automatic and the reality you live in, but really it is just a mental loop you have repeated too many times.</p>
            <p>You can reverse this process. You can create your own focused mental loops. Repeat, <strong>"I love myself"</strong> again and again and again. Lay the pathway for that loop to run over and over. Eventually, it will take hold whether you believe it or not. You need to create a groove that is deeper than those unhappy and unhelpful grooves you've laid down over the years.</p>
            <h3>Meditation</h3>
            <p>Each day, listen to a 5 – 7 minute piece of music that you like and think, <strong>"I love myself."</strong> Visualize that the universe is raining down white light into your head and body.</p>
            <p><strong>Pattern:</strong> Inhale &gt; Think "I love myself" &gt; Exhale &gt; Let out whatever thoughts you have.</p>
            <p>What if you don't believe it? Doesn't matter. Your role is to lay down the pathway for doing it. Connect the neurons and your body and mind will respond automatically.</p>
            <p style="margin-top:20px;font-style:italic;color:var(--accent);">As you love yourself, life loves you back.</p>
            <div class="vow-section">
              <label>Your Personal Vow</label>
              <p style="margin-bottom:12px;color:var(--muted);">Date: <input type="date" id="vowDate" style="width:200px;"></p>
              <p style="margin-bottom:12px;color:var(--muted);">This day, I <input type="text" id="vowName" placeholder="[Your Name]" style="width:200px;"> vow to myself to love myself, to treat myself as someone I love truly and deeply – in my thoughts, my actions, the choices I make, the experiences I have, each moment I am conscious, I make the decision <strong>I LOVE MYSELF.</strong></p>
              <div class="vow-signature">✨ This vow is sacred and personal. Return to it whenever you need to remember.</div>
            </div>
            <div style="margin-top:20px;display:flex;gap:12px;flex-wrap:wrap;">
              <button class="btn" onclick="saveVow()">Save My Vow</button>
              <button class="btn" onclick="viewEntries()">Back to Gallery</button>
            </div>
          </div>
        </div>
      `;
      const today = new Date().toISOString().split('T')[0];
      document.getElementById("vowDate").value = today;
    }

    function saveVow() {
      const vowDate = document.getElementById("vowDate").value;
      alert("Thank you for taking this vow on " + vowDate + ". Remember: I love myself. 💫");
    }

    function newEntry() {
      document.getElementById("main").innerHTML = `
        <div class="card">
          <label for="date">Date</label>
          <input id="date" type="date" value="${new Date().toISOString().split('T')[0]}">
          <label for="miracle" style="margin-top:12px;">Miracle Today</label>
          <textarea id="miracle" placeholder="Type or speak..."></textarea>
          <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn voice" onclick="speakToText('miracle')">🎤 Speak Miracle</button>
            <button class="btn" onclick="document.getElementById('miracle').value=''">Clear</button>
          </div>
          <label for="gratitude" style="margin-top:14px;">Gratitude</label>
          <textarea id="gratitude" placeholder="Type or speak..."></textarea>
          <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn voice" onclick="speakToText('gratitude')">🎤 Speak Gratitude</button>
            <button class="btn" onclick="document.getElementById('gratitude').value=''">Clear</button>
          </div>
          <label for="aha" style="margin-top:14px;">Aha Moment (Perspective)</label>
          <textarea id="aha" placeholder="A shift in perspective, insight, or 'aha'..."></textarea>
          <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn voice" onclick="speakToText('aha')">🎤 Speak Aha</button>
            <button class="btn" onclick="document.getElementById('aha').value=''">Clear</button>
          </div>
          <div style="margin-top:18px;display:flex;gap:12px;">
            <button class="btn" style="flex:1" onclick="saveEntry()">Save Entry</button>
            <button class="btn" style="flex:1" onclick="viewEntries()">View Gallery</button>
          </div>
        </div>
      `;
    }

    function speakToText(fieldId) {
      if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
        alert("Voice to text works best in Chrome on your phone or computer.");
        return;
      }
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      recognition.onresult = (event) => {
        document.getElementById(fieldId).value = event.results[0][0].transcript;
      };
      recognition.onerror = () => {
        alert("Voice recognition error. Try again or type your entry.");
      };
      recognition.start();
    }

    function saveEntry() {
      const date = document.getElementById("date").value;
      const miracle = document.getElementById("miracle").value.trim();
      const gratitude = document.getElementById("gratitude").value.trim();
      const aha = document.getElementById("aha").value.trim();
      if (!(miracle || gratitude || aha)) {
        alert("Add a Miracle, Gratitude, or Aha moment before saving.");
        return;
      }
      entries.unshift({date, miracle, gratitude, aha});
      saveUserEntries();
      alert("Entry saved successfully!");
      viewEntries();
    }

    function viewEntries() {
      let html = `<div class="card"><h2 style="margin-top:0;">My Entries</h2>`;
      if (entries.length === 0) {
        html += `<div class="empty" style="padding:36px;">No entries yet — create your first moment.</div></div>`;
        document.getElementById("main").innerHTML = html;
        return;
      }
      html += `<div class="gallery">`;
      entries.forEach((e, i) => {
        const img = `https://picsum.photos/600/360?random=${encodeURIComponent(e.date + '-' + i)}`;
        const safeTitle = escapeHtml(truncate(e.miracle || e.aha || e.gratitude || "A small moment", 40));
        const safeSubtitle = escapeHtml(truncate(e.aha || e.gratitude || e.miracle || "", 80));
        html += `<div class="tile" style="background-image: linear-gradient(180deg, rgba(0,0,0,0.06), rgba(0,0,0,0.18)), url('${img}');" title="${safeTitle}"><button class="delete" onclick="deleteEntry(${i});event.stopPropagation();">Delete</button><div class="meta" onclick="showDetail(${i})"><div class="title">${safeTitle}${e.aha ? '<span class="badge-aha">AHA</span>' : ''}</div><div class="subtitle">${e.date}${safeSubtitle ? ' · ' + safeSubtitle : ''}</div></div></div>`;
      });
      html += `</div></div>`;
      document.getElementById("main").innerHTML = html;
    }

    function viewAhaEntries() {
      let ahaEntries = entries.filter(e => (e.aha || '').trim());
      let html = `<div class="card"><h2 style="margin-top:0;">AHA Moments (Perspective)</h2>`;
      if (ahaEntries.length === 0) {
        html += `<div class="empty" style="padding:36px;">No AHA moments yet — create one with New Entry.</div></div>`;
        document.getElementById("main").innerHTML = html;
        return;
      }
      html += `<div class="gallery">`;
      ahaEntries.forEach((e, idx) => {
        const originalIndex = entries.indexOf(e);
        const img = `https://picsum.photos/600/360?random=${encodeURIComponent(e.date + '-aha-' + idx)}`;
        const safeTitle = escapeHtml(truncate(e.aha || e.miracle || e.gratitude || "An insight", 40));
        const safeSubtitle = escapeHtml(truncate(e.miracle || e.gratitude || '', 80));
        html += `<div class="tile" style="background-image: linear-gradient(180deg, rgba(0,0,0,0.06), rgba(0,0,0,0.18)), url('${img}');" title="${safeTitle}"><button class="delete" onclick="deleteEntry(${originalIndex});event.stopPropagation();">Delete</button><div class="meta" onclick="showDetail(${originalIndex})"><div class="title">${safeTitle}<span class="badge-aha">AHA</span></div><div class="subtitle">${e.date}${safeSubtitle ? ' · ' + safeSubtitle : ''}</div></div></div>`;
      });
      html += `</div></div>`;
      document.getElementById("main").innerHTML = html;
    }

    function truncate(str, len){
      if(!str) return "";
      return str.length > len ? str.slice(0,len-1)+'…' : str;
    }

    function escapeHtml(s){
      if(!s) return "";
      return String(s).replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});
    }

    function showDetail(i){
      const e = entries[i];
      if(!e) return;
      document.getElementById("main").innerHTML = `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
            <div>
              <h2 style="margin:0 0 6px 0;">${escapeHtml(e.miracle || 'A quiet moment')}</h2>
              <div style="color:var(--muted);font-size:14px">${e.date}${e.aha ? ' · AHA' : ''}</div>
            </div>
            <div>
              <button class="btn" onclick="viewEntries()">Back</button>
              <button class="btn" style="margin-left:8px;background:#c84d4d;color:white;border:none;" onclick="deleteEntry(${i})">Delete</button>
            </div>
          </div>
          <div style="margin-top:16px;color:var(--muted);line-height:1.6;">
            <h3 style="margin:0 0 8px 0;">Gratitude</h3>
            <p style="margin:0 0 16px 0;">${escapeHtml(e.gratitude || '')}</p>
            <h3 style="margin:0 0 8px 0;">Aha Moment (Perspective)</h3>
            <p style="margin:0 0 16px 0;">${escapeHtml(e.aha || '')}</p>
          </div>
        </div>
      `;
    }

    function deleteEntry(i) {
      if (!confirm("Delete this entry?")) return;
      entries.splice(i, 1);
      saveUserEntries();
      viewEntries();
    }

    function exportBook() {
      if (entries.length === 0) return alert("No entries");
      let text = "Lens of Love\n\n";
      entries.forEach(e => text += `${e.date}\nMiracle: ${e.miracle}\nGratitude: ${e.gratitude}\nAha: ${e.aha}\n\n`);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], {type: "text/plain"}));
      a.download = "My-Lens-of-Love.txt";
      a.click();
    }

    window.onload = function(){
      const savedUser = localStorage.getItem("currentUser");
      if (savedUser && users[savedUser]) {
        currentUser = savedUser;
        loadUserEntries();
        showApp();
      } else {
        showAuth();
      }
    };
  </script>
</body>
</html>
